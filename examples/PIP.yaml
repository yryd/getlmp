name: PIP
forcefield: gaff2        # gaff2 / gaff / reaxff
charge_method: resp       # bcc (AM1-BCC) / abcg2 / resp / resp2（reaxff 时为 none）
net_charge: 0
qm:
  engine: quick           # RESP 的 QM 引擎：gaussian（默认，G16+Multiwfn）/ quick（QUICK 旧路径）
molecules:
  - smiles: N1CCNCC1
    name: PIP
    count: 1
# esp 段可调 ESP 可视化导出（默认开启；不需要时 enabled: false，仅单分子 RESP 生效）：
# esp:
#   enabled: true
#   spacing: 0.3          # 网格间距 Å（0.2 更细、0.5 更快）
#   buffer: 1.5           # 分子外扩 Å（网格覆盖范围）
output: PIP.lmp
workdir: work
seed: 2026
