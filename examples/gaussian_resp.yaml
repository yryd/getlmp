# RESP 电荷（Gaussian + Multiwfn，531 路线）：乙醇 → 9 原子 data.lmp
# 运行：cd examples && python ../main.py gaussian_resp.yaml
name: gaussian_resp_ethanol
forcefield: gaff2
charge_method: resp          # resp 走 qm 段指定引擎
net_charge: 0
qm:
  engine: gaussian           # gaussian（默认，G16+Multiwfn）/ quick（QUICK 旧路径）
  method: b3lyp              # 531 推荐 B3LYP-D3(BJ)
  basis: def2-TZVP
  # solvent: water          # 空=气相；RESP2 需要溶剂
  # resp2: false            # RESP2 开关（需 solvent 非空）
  # delta: 0.5              # RESP2 δ
  # multiwfn_path: ''       # 空=自动探测（~/packages/soft/multiwfn/）
molecules:
  - smiles: CCO
    name: ethanol
    count: 1
output: data.lmp
workdir: work
seed: 2026
